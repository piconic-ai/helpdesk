name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Build, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright install --with-deps chromium
      # Runs every test and fails when coverage falls below vitest.config.ts.
      - run: pnpm test:coverage
      - run: node scripts/test-stage1-matrix.mjs
  cognitive-complexity:
    name: Cognitive complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          config: cccc.toml
          path: .
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-docs.py
  visual:
    name: Browser ${{ matrix.suite }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: ui, shard: 1/3 }
          - { suite: ui, shard: 2/3 }
          - { suite: ui, shard: 3/3 }
          - { suite: ux, shard: 1/1 }
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:${{ matrix.suite }} --shard=${{ matrix.shard }} --output=test-results
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3
