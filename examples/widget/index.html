<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>請求・領収書 · Slide</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font:
        16px/1.65 system-ui,
        sans-serif;
      background: #f5f6f8;
      color: #202934;
    }
    header {
      padding: 18px max(6vw, 20px);
      border-bottom: 1px solid #d9dde1;
      background: white;
    }
    header b {
      font-size: 22px;
      letter-spacing: -0.04em;
    }
    main {
      width: min(820px, 100%);
      margin: 52px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: clamp(24px, 5vw, 32px);
      margin: 0 0 32px;
    }
    section {
      padding: 20px;
      background: white;
      border: 1px solid #d9dde1;
      border-radius: 10px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th,
    td {
      padding: 12px 6px;
      border-top: 1px solid #e3e5e8;
    }
    td:last-child,
    th:last-child {
      text-align: right;
    }
    a {
      color: #244d72;
    }
  </style>
  <header><b>Slide</b></header>
  <main>
    <h1>請求・領収書</h1>
    <section aria-labelledby="receipts">
      <h2 id="receipts">お支払い履歴</h2>
      <table>
        <thead>
          <tr>
            <th>請求月</th>
            <th>金額</th>
            <th>明細</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2026年11月</td>
            <td>¥3,000</td>
            <td><a href="/receipts/2026-11.csv" download>CSV</a></td>
          </tr>
          <tr>
            <td>2026年10月</td>
            <td>¥3,000</td>
            <td><a href="/receipts/2026-10.csv" download>CSV</a></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script
    src="__HELPDESK_ORIGIN__/widget.js"
    data-product="slide"
    referrerpolicy="no-referrer"
    async
  ></script>
</html>
